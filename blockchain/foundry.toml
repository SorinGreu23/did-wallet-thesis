[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./abis" },
  { access = "read", path = "./out" },
]