name: did-wallet-services

# .NET application services — rebuild and redeploy freely without touching infra.
# This is a standalone project (did-wallet-services) — fully independent of the infra layer.
# Requires the infra project to be running first so the did-infra network exists:
#   docker compose -f docker-compose.infra.yml up -d
#
# Rebuild all:        docker compose -f docker-compose.services.yml up -d --build
# Rebuild one:        docker compose -f docker-compose.services.yml up -d --build accreditation
# Tear down services: docker compose -f docker-compose.services.yml down  (infra untouched)

services:
  identity:
    build:
      context: ./DID.WalletThesis
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: DID.Identity
    container_name: did-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=did_identity;Username=did_user;Password=did_password"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: did_user
      RabbitMQ__Password: did_password
    ports:
      - "5259:8080"
    networks:
      - did-infra
      - did-services
      - did-admin

  accreditation:
    build:
      context: ./DID.WalletThesis
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: DID.Accreditation
    container_name: did-accreditation
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=did_accreditation;Username=did_user;Password=did_password"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: did_user
      RabbitMQ__Password: did_password
      Blockchain__RpcUrl: "http://foundry:8545"
      Blockchain__BrowserRpcUrl: "http://localhost:8545"
      Blockchain__AbisDirectory: /app/abis
      Blockchain__Contracts__AccreditationRegistry: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
    ports:
      - "5211:8080"
    volumes:
      - ./blockchain/abis:/app/abis:ro
    networks:
      - did-infra
      - did-services
      - did-admin

  blockchain-sync:
    build:
      context: ./DID.WalletThesis
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: DID.BlockchainSync
    container_name: did-blockchain-sync
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=did_blockchainsync;Username=did_user;Password=did_password"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: did_user
      RabbitMQ__Password: did_password
      Blockchain__RpcUrl: "http://foundry:8545"
      Blockchain__AbisDirectory: /app/abis
      Blockchain__Contracts__AccreditationRegistry: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      Blockchain__Contracts__CredentialRegistry: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
    volumes:
      - ./blockchain/abis:/app/abis:ro
    networks:
      - did-infra
      - did-services

  credential:
    build:
      context: ./DID.WalletThesis
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: DID.Credential
    container_name: did-credential
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=did_credential;Username=did_user;Password=did_password"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: did_user
      RabbitMQ__Password: did_password
      Blockchain__RpcUrl: "http://foundry:8545"
      Blockchain__AbisDirectory: /app/abis
      Blockchain__Contracts__CredentialRegistry: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
    ports:
      - "5214:8080"
    volumes:
      - ./blockchain/abis:/app/abis:ro
    networks:
      - did-infra
      - did-services
      - did-admin

  presentation:
    build:
      context: ./DID.WalletThesis
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: DID.Presentation
    container_name: did-presentation
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5217:8080"
    networks:
      - did-services

  admin-client:
    build:
      context: ./DID.WalletThesis/src/admin-client
      dockerfile: Dockerfile
    container_name: did-admin-client
    ports:
      - "4200:80"
    networks:
      - did-admin
    depends_on:
      - accreditation
      - identity
      - credential

networks:
  did-infra:
    external: true
    name: did-infra
  did-services:
    driver: bridge
    name: did-services
  did-admin:
    driver: bridge
    name: did-admin

