name: did-wallet-infra

# Infrastructure services — start once, leave running.
# Foundry/Anvil chain state, Postgres data, and RabbitMQ state all persist via named volumes.
# This is a standalone project (did-wallet-infra) — fully independent of the services layer.
#
# Start:   docker compose -f docker-compose.infra.yml up -d
# Stop:    docker compose -f docker-compose.infra.yml stop   (keeps volumes intact)
# Destroy: docker compose -f docker-compose.infra.yml down -v  (wipes volumes)

services:
  postgres:
    image: postgres:16-alpine
    container_name: did-postgres
    environment:
      POSTGRES_USER: did_user
      POSTGRES_PASSWORD: did_password
      POSTGRES_DB: did_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - did-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U did_user -d did_wallet"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: did-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: did_user
      RABBITMQ_DEFAULT_PASS: did_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - did-infra
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  foundry:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: did-foundry
    user: root
    entrypoint: sh
    command:
      - -c
      - |
        mkdir -p /data
        chmod 777 /data

        echo "Contents of /data before starting Anvil:"
        ls -lah /data

        if [ -f /data/anvil-state.json ]; then
          echo "Loading Anvil state from /data/anvil-state.json"
          exec anvil \
            --host 0.0.0.0 \
            --port 8545 \
            --chain-id 31337 \
            --load-state /data/anvil-state.json \
            --dump-state /data/anvil-state.json
        else
          echo "No existing Anvil state found. Starting fresh chain."
          exec anvil \
            --host 0.0.0.0 \
            --port 8545 \
            --chain-id 31337 \
            --dump-state /data/anvil-state.json
        fi
    ports:
      - "8545:8545"
    volumes:
      - foundry_data:/data
    networks:
      - did-infra
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  contract-deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: did-contract-deployer
    entrypoint: forge
    working_dir: /workspace/blockchain
    volumes:
      - .:/workspace
    networks:
      - did-infra
    command:
      - script
      - script/Deploy.s.sol
      - --rpc-url
      - http://foundry:8545
      - --broadcast
      - --private-key
      - ${ANVIL_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    depends_on:
      - foundry
    profiles:
      - tools

  contract-builder:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: did-contract-builder
    entrypoint: forge
    working_dir: /workspace/blockchain
    volumes:
      - .:/workspace
    command:
      - build
    profiles:
      - tools

  abi-exporter:
    image: node:20-alpine
    container_name: did-abi-exporter
    working_dir: /workspace/blockchain
    volumes:
      - .:/workspace
    command:
      - node
      - export-abis.js
    profiles:
      - tools

  deployment-exporter:
    image: node:20-alpine
    container_name: did-deployment-exporter
    working_dir: /workspace/blockchain
    volumes:
      - .:/workspace
    command:
      - node
      - export-deployment.js
    profiles:
      - tools

  contract-tester:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: did-contract-tester
    entrypoint: forge
    working_dir: /workspace/blockchain
    volumes:
      - .:/workspace
    command:
      - test
    profiles:
      - tools

volumes:
  postgres_data:
  rabbitmq_data:
  foundry_data:

networks:
  did-infra:
    driver: bridge
    name: did-infra
